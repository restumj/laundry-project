{% extends "base.html" %}
{% block title %}Beranda{% endblock %}
{% block content %}
<h1>Laundry App</h1>

<article>
  <header><strong>Siapa yang bertugas?</strong></header>
  <form method="post" action="/staff">
    <label>Staff
      <select name="staff_id" required>
        <option value="">-- pilih --</option>
        {% for s in staff_list %}
        <option value="{{ s.staff_id }}" {% if current == s.staff_id %}selected{% endif %}>{{ s.staff_name }}</option>
        {% endfor %}
      </select>
    </label>
    <button type="submit">Mulai bertugas</button>
  </form>
</article>
{% endblock %}
